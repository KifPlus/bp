<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Heritage Tobacco - 3D Factory (50 ft x 140 ft shed)</title>
<style>
:root{--panel:rgba(22,20,17,.88);--gold:#d9a441;--ink:#f2e9d6;--mute:#a99f8c;--line:rgba(217,164,65,.28)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#0c0e0f;font-family:'Segoe UI',system-ui,sans-serif;color:var(--ink)}
canvas{display:block}
#panel{position:absolute;left:16px;top:16px;width:310px;max-height:calc(100% - 100px);overflow:auto;background:var(--panel);backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:14px;padding:16px;z-index:5}
#panel h1{margin:0;font-size:19px;font-weight:700}
#panel p.sub{margin:2px 0 12px;color:var(--mute);font-size:12px;line-height:1.45}
#panel h2{margin:16px 0 8px;font-size:12px;font-weight:600;color:var(--gold)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips span{font-size:11px;padding:4px 9px;border:1px solid var(--line);border-radius:999px}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:6px}
button{font:inherit;color:var(--ink);cursor:pointer}
.btns button,#bar button{background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:9px;padding:8px 6px;font-size:12px}
.btns button:hover,#bar button:hover{background:rgba(217,164,65,.16)}
.btns button.on,#bar button[aria-pressed=true]{background:var(--gold);color:#1a1409;border-color:var(--gold);font-weight:600}
button:focus-visible,li:focus-visible{outline:2px solid #fff;outline-offset:2px}
#zones{list-style:none;margin:0;padding:0}
#zones li{padding:7px 8px;border-radius:8px;cursor:pointer;font-size:12.5px}
#zones li:hover,#zones li.on{background:rgba(217,164,65,.14)}
#zones .r{display:flex;justify-content:space-between;gap:8px}
#zones .r i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:8px}
#zones b{color:var(--gold);font-weight:600}
#zones .bar{height:3px;border-radius:2px;margin-top:5px;background:rgba(255,255,255,.08)}
#zones .bar s{display:block;height:100%;border-radius:2px}
#card{margin-top:12px;padding:12px;border-radius:10px;background:rgba(255,255,255,.05);font-size:12.5px;line-height:1.5;display:none}
#card h3{margin:0 0 4px;font-size:14px}
#card p{margin:0 0 6px;color:var(--mute)}
#bar{position:absolute;right:16px;bottom:16px;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;z-index:5;padding-bottom:env(safe-area-inset-bottom,0)}
#bar button{background:var(--panel);backdrop-filter:blur(10px);padding:9px 14px}
#menu{display:none;position:absolute;left:12px;top:12px;z-index:6;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:9px 14px;font-size:13px}
.tag{font:600 11px 'Segoe UI',sans-serif;color:#f4ead7;background:rgba(14,13,12,.74);padding:3px 10px;border-radius:12px;border-left:3px solid;white-space:nowrap}
.tag.sm{font-size:9.5px;padding:2px 7px}
.nolabels .tag{display:none}
@media(max-width:760px){
 #menu{display:block}
 #panel{display:none;left:8px;right:8px;top:56px;width:auto;max-height:58%}
 #panel.open{display:block}
 #bar{left:8px;right:8px;justify-content:center}
 #bar button{padding:8px 10px;font-size:11px}
}
</style>
</head>
<body>
<button id="menu" aria-label="Open controls">Controls</button>
<aside id="panel">
  <h1>Heritage Tobacco</h1>
  <p class="sub">Shed from your drawing: 50 ft x 140 ft, 7,000 sq.ft, 25 ft eave height, 20 ft opening on the road side.</p>
  <div class="chips"><span>8 laborers</span><span>2 managers</span><span>6 portal frames</span><span>2 fermentation lofts</span></div>
  <h2>Camera views</h2>
  <div class="btns" id="views"></div>
  <h2>Zones (sq.ft)</h2>
  <ul id="zones"></ul>
  <div id="card"></div>
</aside>
<div id="bar">
  <button id="bDay" aria-pressed="false">Night</button>
  <button id="bSolid" aria-pressed="false">Solid shell</button>
  <button id="bRoof" aria-pressed="true">Roof</button>
  <button id="bRight" aria-pressed="false">Right wall</button>
  <button id="bLab" aria-pressed="true">Labels</button>
  <button id="bRot" aria-pressed="false">Auto-rotate</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/renderers/CSS2DRenderer.js"></script>
<script>
const $=s=>document.querySelector(s);
const V=(x,y,z)=>new THREE.Vector3(x,y,z);
const M=(c,r=.6,m=.1,o={})=>new THREE.MeshStandardMaterial(Object.assign({color:c,roughness:r,metalness:m},o));
const scene=new THREE.Scene();
scene.background=new THREE.Color(0xb7c6cf);
scene.fog=new THREE.FogExp2(0xb7c6cf,.0016);
const cam=new THREE.PerspectiveCamera(45,innerWidth/innerHeight,.5,1500);
cam.position.set(100,75,140);
const ren=new THREE.WebGLRenderer({antialias:true});
ren.setPixelRatio(Math.min(devicePixelRatio,2));ren.setSize(innerWidth,innerHeight);
ren.shadowMap.enabled=true;ren.shadowMap.type=THREE.PCFSoftShadowMap;
ren.outputEncoding=THREE.sRGBEncoding;ren.toneMapping=THREE.ACESFilmicToneMapping;
document.body.prepend(ren.domElement);
const lr=new THREE.CSS2DRenderer();lr.setSize(innerWidth,innerHeight);
Object.assign(lr.domElement.style,{position:'absolute',top:0,left:0,pointerEvents:'none'});
document.body.prepend(lr.domElement);
const ctl=new THREE.OrbitControls(cam,ren.domElement);
Object.assign(ctl,{enableDamping:true,dampingFactor:.06,maxPolarAngle:Math.PI*.495,minDistance:8,maxDistance:420,autoRotateSpeed:.5});
ctl.target.set(0,6,10);

/* W = world group sitting on top of the floor slab (units are feet) */
const W=new THREE.Group();W.position.y=.5;scene.add(W);
const B=(w,h,d,mat,x,y,z,par=W,sh=true)=>{const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);m.position.set(x,y,z);m.castShadow=m.receiveShadow=sh;par.add(m);return m};
const Cy=(r1,r2,h,mat,x,y,z,par=W,n=20)=>{const m=new THREE.Mesh(new THREE.CylinderGeometry(r1,r2,h,n),mat);m.position.set(x,y,z);m.castShadow=true;par.add(m);return m};
function tag(t,x,y,z,col='#d9a441',sm){const d=document.createElement('div');d.className='tag'+(sm?' sm':'');d.textContent=t;d.style.borderColor=col;const o=new THREE.CSS2DObject(d);o.position.set(x,y,z);scene.add(o);return o}

/* lights */
const hemi=new THREE.HemisphereLight(0xdfeaf2,0x6b5d4a,.9);scene.add(hemi);
const sun=new THREE.DirectionalLight(0xfff1d6,1.6);
sun.position.set(80,140,60);sun.castShadow=true;const SM=innerWidth<760?2048:4096;sun.shadow.mapSize.set(SM,SM);
Object.assign(sun.shadow.camera,{left:-110,right:110,top:110,bottom:-110,near:1,far:400});sun.shadow.bias=-.0004;scene.add(sun);
const bulbMat=M(0xffd9a0,.4,0,{emissive:0xffd9a0,emissiveIntensity:.3});
const ceil=[-56,-30,-4,22,48].map(z=>{
  const l=new THREE.PointLight(0xffb870,.35,90);l.position.set(0,20,z);scene.add(l);
  [-12,12].forEach(x=>{const b=new THREE.Mesh(new THREE.CylinderGeometry(1.8,2.4,1,16),bulbMat);b.position.set(x,22,z);W.add(b)});return l});

/* ground, yard, road, slab */
const grass=new THREE.Mesh(new THREE.PlaneGeometry(1600,1600),M(0x56624f,.95,0));
grass.rotation.x=-Math.PI/2;grass.position.y=-.1;grass.receiveShadow=true;scene.add(grass);
B(170,.5,205,M(0x74777a,.9,0),0,.2,25,scene);
B(700,.5,26,M(0x2b2d2f,.9,0),0,.2,140,scene);
for(let i=-25;i<=25;i++)B(7,.02,.5,M(0xeeeeee,.7,0),i*14,.46,140,scene,false);
function floorTex(){const c=document.createElement('canvas');c.width=c.height=256;const g=c.getContext('2d');
  g.fillStyle='#8a8172';g.fillRect(0,0,256,256);
  for(let i=0;i<1600;i++){g.fillStyle=Math.random()<.5?'rgba(255,255,255,.04)':'rgba(0,0,0,.05)';g.fillRect(Math.random()*256,Math.random()*256,2,2)}
  g.strokeStyle='rgba(0,0,0,.4)';g.lineWidth=3;g.strokeRect(0,0,256,256);
  const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(5,14);t.anisotropy=8;return t}
B(50,.5,140,M(0xffffff,.55,.1,{map:floorTex()}),0,.27,0,scene);

/* shell: cladding, gable ends, roof, portal frames (from the drawing: 6 frames, 28 ft bays) */
const shellMats=[],steel=M(0x39414a,.5,.7);
const stripeT=(()=>{const c=document.createElement('canvas');c.width=64;c.height=8;const g=c.getContext('2d');
  g.fillStyle='#d6d9dc';g.fillRect(0,0,64,8);g.fillStyle='rgba(0,0,0,.2)';g.fillRect(0,0,3,8);g.fillStyle='rgba(255,255,255,.4)';g.fillRect(3,0,2,8);
  const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;return t})();
const wm=(rx,ry=1)=>{const t=stripeT.clone();t.needsUpdate=true;t.repeat.set(rx,ry);const m=M(0xffffff,.5,.35,{map:t,side:THREE.DoubleSide});shellMats.push(m);return m};
const walls=new THREE.Group();W.add(walls);
const RISE=4.4,ANG=Math.atan2(RISE,25);
B(.5,25,140,wm(70),-25.25,12.5,0,walls,false);
const rightWall=B(.5,25,140,wm(70),25.25,12.5,0,walls,false);rightWall.visible=false;
function gable(z,notch){
  const p=notch?[[-25,0],[-10,0],[-10,18],[10,18],[10,0],[25,0],[25,25],[0,25+RISE],[-25,25]]:[[-25,0],[25,0],[25,25],[0,25+RISE],[-25,25]];
  const s=new THREE.Shape(p.map(q=>new THREE.Vector2(q[0],q[1])));
  const m=new THREE.Mesh(new THREE.ExtrudeGeometry(s,{depth:.5,bevelEnabled:false}),wm(.5,.05));
  m.position.z=z;walls.add(m)}
gable(-70.5,false);gable(70,true);
/* roller shutter rolled above the 20 ft opening, door posts */
Cy(.9,.9,20,M(0x8a8f94,.5,.8),0,18.9,69.3,W,16).rotation.z=Math.PI/2;
[-10.3,10.3].forEach(x=>B(.6,18,.9,steel,x,9,69.8));
/* roof */
const roofG=new THREE.Group();W.add(roofG);
const roofMat=M(0xaeb7be,.4,.6,{side:THREE.DoubleSide});shellMats.push(roofMat);
const rl=Math.hypot(25,RISE)+1.6;
[-1,1].forEach(s=>{const r=B(rl,.3,142,roofMat,s*13.2,27.15,0,roofG,false);r.rotation.z=s*ANG;
  B(.8,.7,142,M(0x2b2f33,.6,.5),s*26.7,24.2,0,roofG,false)});
B(1.2,.4,142,steel,0,25+RISE+.55,0,roofG,false);
/* frames and purlins */
for(let i=0;i<6;i++){const z=-69.4+i*27.88;
  [-1,1].forEach(s=>{B(.7,25,1.1,steel,s*24.6,12.5,z);const r=B(25.4,.9,.5,steel,s*12.5,26.5,z);r.rotation.z=s*ANG})}
[6,12,18].forEach(k=>[-1,1].forEach(s=>B(.25,.4,140,steel,s*k,25+RISE*(25-k)/25+.55,0,W,false)));

/* floor outlines and zone data (rect = [x0,x1,z0,z1] in ft, centred on the shed) */
function outline(r,col){const [x0,x1,z0,z1]=r,m=M(col,.7,0,{emissive:col,emissiveIntensity:.3});
  [z0,z1].forEach(z=>B(x1-x0,.04,.35,m,(x0+x1)/2,.03,z,W,false));
  [x0,x1].forEach(x=>B(.35,.04,z1-z0,m,x,.03,(z0+z1)/2,W,false))}
const Z=[
{n:'RMC Storage',a:850,c:'#e9a77b',r:[-25,25,-70,-53],ty:8,d:'Pallet racks of raw material sacks and drums along the back wall, the start of the process flow.'},
{n:'Pandarpuri Line',a:600,c:'#6fa4ff',r:[-25,-5,-50,-20],ty:9,d:'Three blue machines with spinning drums and status lights. Laborers 1 to 3 work the east aisle.'},
{n:'Shisha Line',a:600,c:'#ff9a55',r:[5,25,-50,-20],ty:9,d:'Three orange units with mixing tanks. Laborers 4 to 6 work the west aisle.'},
{n:'Office',a:300,c:'#f0d9b5',r:[-25,-13,-17,8],ty:12,d:'Separate glass office with desks and storage, 12 ft x 25 ft.'},
{n:'Meeting Room',a:250,c:'#d9b8ff',r:[-13,-3,-17,8],ty:12,d:'Glass meeting room with a 14 ft table and 8 chairs.'},
{n:'Washrooms (2)',a:200,c:'#9fc3dd',r:[3,11,-17,8],ty:12,d:'Two washroom blocks, 8 ft x 25 ft together.'},
{n:'Special RM Lab',a:350,c:'#8fe3b0',r:[11,25,-17,8],ty:12,d:'Glass lab with two benches and microscopes for raw material checks.'},
{n:'Packaging',a:500,c:'#7fd3ff',r:[-25,-5,12,37],ty:9,d:'Packing machine feeding a live conveyor toward the finished product boxes and dispatch.'},
{n:'Utility / Spare',a:400,c:'#c9ac8c',r:[9,25,12,37],ty:7,d:'Compressor, electrical panels and spare parts storage.'},
{n:'Loading / Dispatch',a:500,c:'#ff9a7a',r:[-10,10,45,70],ty:8,d:'20 ft x 25 ft bay lined up with the 20 ft front opening so trucks reverse straight in.'},
{n:'Fermentation Lofts',a:1200,c:'#d08a55',r:[-25,-15,-10,50],ty:19,k:'above',nol:1,d:'Two mezzanine lofts, 10 ft x 60 ft each (600 sq.ft each), 12 ft above the floor with stairs near the front. Counted on top of the ground floor zones.'},
{n:'Aisles and circulation',a:2450,c:'#8a8f94',r:[-5,9,-20,45],ty:4,k:'in',nol:1,d:'Balance of the 7,000 sq.ft: walkways, drainage channel and finished goods staging.'},
{n:'Parking (outside)',a:1250,c:'#c7b99a',r:[-56,-31,74,124],ty:4,k:'out',d:'Parking bays in the yard on the road side, outside the shed.'}];
Z.forEach(z=>{const [x0,x1,z0,z1]=z.r;z.cx=(x0+x1)/2;z.cz=(z0+z1)/2;
  if(!z.nol)outline(z.r,z.c);
  if(z.k!=='in'||!z.nol)tag(z.n+' '+z.a.toLocaleString(),z.cx,z.ty,z.cz,z.c)});
tag('Left loft 600',-20,16,20,'#d08a55');tag('Right loft 600',20,16,20,'#d08a55');
tag('TOTAL AREA 7,000 SQ.FT',0,2,-7,'#ffffff');

/* rooms */
function room(r,col,opq){const [x0,x1,z0,z1]=r,w=x1-x0,d=z1-z0,cx=(x0+x1)/2,cz=(z0+z1)/2;
  B(w,10,d,opq?M(col,.7,.05):M(col,.1,.2,{transparent:true,opacity:.28,depthWrite:false}),cx,5,cz,W,!!opq);
  if(opq)B(w+.6,.5,d+.6,M(0x3b3a38,.8),cx,10.25,cz);
  [[x0,z0],[x1,z0],[x0,z1],[x1,z1]].forEach(([x,z])=>B(.4,10,.4,steel,x,5,z));
  B(3.5,7,.15,M(0x4a3a2a,.7),cx-w/4,3.5,z1+.1)}
const wood=M(0xa56d3f,.6),dk=M(0x2a2d31,.6,.3);
const desk=(x,z)=>{B(5,.3,2.5,wood,x,2.6,z);B(.4,2.5,2.2,dk,x-2.2,1.3,z);B(.4,2.5,2.2,dk,x+2.2,1.3,z);B(1.6,1,.1,M(0x111418,.3,.5),x,3.4,z-.8)};
const chair=(x,z)=>{B(1.4,.3,1.4,dk,x,1.7,z);B(.3,1.6,1.4,dk,x,2.6,z-.8);B(.2,1.6,.2,dk,x,.85,z)};
room(Z[3].r,'#f0d9b5');[-12,-4,4].forEach(z=>{desk(-19,z);chair(-19,z+2)});B(1.5,5,3,M(0x8b8e91,.5,.4),-24,2.5,-13);
room(Z[4].r,'#d9b8ff');B(3.5,.3,14,wood,-8,2.7,-4.5);B(1,2.5,1,dk,-8,1.3,-4.5);
[-9,-5,-1,3].forEach(z=>{chair(-10.3,z);chair(-5.7,z)});
room(Z[5].r,'#93b3c9',true);
room(Z[6].r,'#8fb4ff');const white=M(0xe6e9ec,.35,.4);
B(3,3,14,white,22,1.5,-4.5);B(3,3,10,white,14,1.5,-3);
Cy(.5,.7,1.8,M(0xff66aa,.4,.4),22,3.9,-3,W,12);Cy(.5,.7,1.8,M(0xff66aa,.4,.4),14,3.9,-1,W,12);
[0x66e0b0,0xffcc66,0x66aaff].forEach((c,i)=>Cy(.4,.4,1.1,M(c,.2,.1,{transparent:true,opacity:.8}),22,3.6,-8+i*2,W,10));
B(3,7,5,white,23.2,3.5,-14);

/* RMC racks and drums */
const sack=[0xd9b77d,0xc8a56a,0xe6c690];
[-67,-61].forEach(z=>{for(let i=0;i<6;i++){const x=-21+i*8;
  [[-3.4,-1.4],[3.4,-1.4],[-3.4,1.4],[3.4,1.4]].forEach(([a,b])=>B(.3,9,.3,M(0x2f5fa8,.5,.5),x+a,4.5,z+b));
  [1,3.8,6.6].forEach((y,k)=>{B(7,.3,3,M(0x8a6a3a,.8),x,y,z);for(let j=0;j<3;j++)B(1.9,1.2,1.5,M(sack[(i+j+k)%3],.9,0),x-2.2+j*2.2,y+.75,z)})}});
for(let i=0;i<12;i++)Cy(1.1,1.1,3,M([0xb26f37,0xc78346,0xd8955a][i%3],.45,.5),-22+i*4,1.5,-55,W,16);

/* machines (Pandarpuri blue, Shisha orange) */
const spin=[],blink=[];
function machine(x,z,col,tr,th){
  B(7,3.5,8,M(col,.35,.6),x,1.75,z);B(6,.3,6,M(0x20252a,.5,.5),x,3.6,z);
  const t=Cy(tr,tr,th,M(0xdfe3e6,.25,.9),x,3.75+th/2,z);spin.push(t);
  B(tr*1.9,.2,.5,dk,0,th/2+.1,0,t);B(.4,th*.8,.4,dk,tr,0,0,t);
  blink.push(B(.6,.6,.6,M(0x00ff88,.3,0,{emissive:0x00ff88,emissiveIntensity:1}),x+3,4,z+3.4))}
[-44,-35,-26].forEach(z=>{machine(-15,z,0x3f8bff,1.8,2);machine(15,z,0xff8844,2.4,4)});

/* packaging, conveyor, finished boxes */
B(8,7,7,M(0x66ccff,.35,.5),-15,3.5,20);B(5,1.6,4,M(0xd8e6ee,.3,.7),-15,7.8,20);
B(2.6,.5,21,M(0x25282b,.8,.2),-15,3,34.5);
[26,34,42].forEach(z=>[-16.1,-13.9].forEach(x=>B(.4,3,.4,dk,x,1.5,z)));
const bc=[0xff6666,0x66dd66,0xffaa44,0xaa66ff,0x44ccff,0xff88aa],items=[];
for(let i=0;i<6;i++)items.push(B(1.5,1,1.5,M(bc[i],.6),-15,3.75,25+i*3.5));
for(let i=0;i<40;i++){const L=Math.floor(i/20),j=i%20;B(2,1.7,2.2,M(bc[i%6],.6),-19+(j%4)*2.3,.85+L*1.75,53+Math.floor(j/4)*3)}
/* utility */
Cy(2.2,2.2,7,M(0x8a2f2f,.4,.6),13,3.5,18,W,16);Cy(2.2,2.2,7,M(0x8a2f2f,.4,.6),19,3.5,18,W,16);
B(4,6,2,M(0x6a7076,.5,.5),23,3,34);B(4,6,2,M(0x6a7076,.5,.5),18,3,34);B(6,3,5,M(0xc9ac8c,.8),14,1.5,30);
/* loading bay floor mark and truck */
const truck=new THREE.Group();truck.position.set(0,.45,86);scene.add(truck);
B(8.4,9,22,M(0xf1f1ee,.5,.2),0,6.4,-4,truck);B(8.4,7,6.2,M(0xb8352b,.4,.4),0,4.5,10.1,truck);
B(7,2.4,.1,M(0x9fc4d4,.1,.6),0,5.6,13.25,truck);
[-10,-3,10].forEach(z=>[-4.2,4.2].forEach(x=>{Cy(1.6,1.6,1.2,M(0x1b1b1b,.9,0),x,1.6,z,truck,16).rotation.z=Math.PI/2}));

/* lofts: platform at 12 ft, rails, posts, berths, stairs */
[-1,1].forEach(s=>{
  B(10,.6,60,wood,20*s,12,20);
  [-10,5,20,35,50].forEach(z=>B(.5,11.7,.5,steel,15.3*s,5.9,z));
  B(.15,.15,60,steel,15.2*s,15,20);B(.15,.15,60,steel,15.2*s,13.7,20);
  for(let i=0;i<12;i++){const x=20*s+(i%2?2.4:-2.4)*1,z=-4+Math.floor(i/2)*9;B(3.8,2.6,6,M(0xcc8844,.6),x,13.6,z)}
  for(let i=0;i<24;i++)B(3,.25,.65,wood,22.5*s,.25+i*.5,66-i*.65)});
/* trees */
[[-45,-60],[-50,-20],[-45,20],[48,-60],[55,-10],[50,30],[-60,-85],[60,-85],[45,50],[70,90],[-70,40],[0,-90]].forEach(([x,z])=>{
  Cy(1.1,1.5,5,M(0x5b4129,.9,0),x,2.5,z,scene,8);
  [[6,9,10],[4.5,8,15]].forEach(([r,h,y])=>{const f=new THREE.Mesh(new THREE.ConeGeometry(r,h,9),M(0x3f6e3a,.9,0));f.position.set(x,y,z);f.castShadow=true;scene.add(f)})});
/* parking bays and cars */
for(let i=0;i<6;i++)B(25,.02,.25,M(0xffffff,.7,0),-43.5,.5,74+i*10,W,false);
[[79,0xb8352b],[99,0x2f5fa8],[109,0xdadada]].forEach(([z,c])=>{B(13,2,6,M(c,.3,.6),-43.5,1.5,z);B(6,1.6,5,M(0x1c2630,.2,.6),-44,3.2,z);
  [-4,4].forEach(x=>[-3,3].forEach(zz=>{Cy(1.1,1.1,.8,dk,-43.5+x,1.1,z+zz,W,12).rotation.x=Math.PI/2}))});
/* dimension lines from the drawing */
const gold=new THREE.LineBasicMaterial({color:0xd9a441});
function dim(a,b,t){scene.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints([V(...a),V(...b)]),gold));tag(t,(a[0]+b[0])/2,(a[1]+b[1])/2+1.5,(a[2]+b[2])/2)}
dim([-25,1,77],[25,1,77],'50 ft');dim([-33,1,-70],[-33,1,70],'140 ft');dim([-33,1,74],[-33,26,74],'25 ft eave height');
tag('Front opening 20 ft',0,21,72,'#ffffff');tag('ROAD',0,3,140,'#ffffff');

/* steam */
const spr=(()=>{const c=document.createElement('canvas');c.width=c.height=64;const g=c.getContext('2d');
  const r=g.createRadialGradient(32,32,2,32,32,32);r.addColorStop(0,'rgba(255,255,255,.9)');r.addColorStop(1,'rgba(255,255,255,0)');
  g.fillStyle=r;g.fillRect(0,0,64,64);return new THREE.CanvasTexture(c)})();
const steams=[-20,20].map(cx=>{const n=34,a=new Float32Array(n*3);
  for(let i=0;i<n;i++){a[i*3]=cx+(Math.random()-.5)*9;a[i*3+1]=14+Math.random()*6;a[i*3+2]=-10+Math.random()*60}
  const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(a,3));
  const p=new THREE.Points(g,new THREE.PointsMaterial({size:6,map:spr,transparent:true,opacity:.2,depthWrite:false,color:0xffe3b8}));
  scene.add(p);return p});

/* people: 8 laborers + 2 managers, about 5.5 ft tall */
const workers=[];
function worker(x,z,col,name,mgr,ax,amp,sp,ph){
  const g=new THREE.Group();g.position.set(x,0,z);g.scale.setScalar(3.7);W.add(g);
  const cl=M(col,.8,0),skin=M(0xe8bfa0,.7,0),pm=M(0x2c3440,.8,0);
  B(.5,.6,.3,cl,0,.9,0,g);
  const head=new THREE.Mesh(new THREE.SphereGeometry(.17,16,16),skin);head.position.y=1.37;head.castShadow=true;g.add(head);
  const hat=new THREE.Mesh(new THREE.SphereGeometry(.19,16,10,0,Math.PI*2,0,Math.PI/2),M(mgr?0xd9a441:0xf2f2f2,.5,.1));hat.position.y=1.4;g.add(hat);
  const limb=(w,h,px,py,m)=>{const geo=new THREE.BoxGeometry(w,h,w);geo.translate(0,-h/2,0);const l=new THREE.Mesh(geo,m);l.position.set(px,py,0);l.castShadow=true;g.add(l);return l};
  workers.push({g,head,t:tag(name,x,9,z,mgr?'#d9a441':'#ffffff',true),legs:[limb(.18,.6,-.13,.6,pm),limb(.18,.6,.13,.6,pm)],arms:[limb(.14,.5,-.33,1.18,cl),limb(.14,.5,.33,1.18,cl)],x,z,ax,amp,sp,ph,dir:1})}
const wc=[0xff6666,0x66dd66,0xffaa44,0xaa66ff,0x44ccff,0xff88aa,0x66e0b0,0xff9f7a];
[[-9,-44,'z',3,.5],[-9,-35,'z',3,.5],[-9,-26,'z',3,.5],[9,-44,'z',3,.5],[9,-35,'z',3,.5],[9,-26,'z',3,.5],[1,25,'z',14,.22],[0,56,'x',7,.35]]
 .forEach(([x,z,ax,a,s],i)=>worker(x,z,wc[i],'Laborer '+(i+1),false,ax,a,s,i*1.3));
worker(-4,-51,0x2f6fd0,'Production Manager',true,'z',0,0,0);
worker(7,-14.5,0x2f6fd0,'Quality Manager',true,'z',0,0,2);

/* UI, views, camera */
const P={overview:{p:[100,75,140],l:[0,6,10]},top:{p:[0,215,.01],l:[0,0,0]},iso:{p:[125,95,125],l:[0,0,0]},
  front:{p:[0,16,215],l:[0,14,0]},road:{p:[55,8,165],l:[0,8,50]},fly:null,worker:null};
const VW=[['overview','Overview'],['top','Top plan'],['iso','Isometric'],['front','Front elevation'],['road','Road view'],['fly','Fly-through'],['worker','Worker view']];
let mode='orbit',tw=null,active='overview';
function fly(p,l,d=1.7){tw={p0:cam.position.clone(),l0:ctl.target.clone(),p1:V(...p),l1:V(...l),t:0,d}}
function mark(){document.querySelectorAll('#views button').forEach(b=>b.classList.toggle('on',b.dataset.v===active));
  document.querySelectorAll('#zones li').forEach(li=>li.classList.toggle('on',li.dataset.z===active))}
function setRot(v){ctl.autoRotate=v;$('#bRot').setAttribute('aria-pressed',v)}
function setView(id){
  if(mode!=='orbit'){const d=V(0,0,0);cam.getWorldDirection(d);ctl.target.copy(cam.position).addScaledVector(d,15)}
  active=id;mode=(id==='fly'||id==='worker')?id:'orbit';tw=null;ctl.enabled=mode==='orbit';setRot(false);
  $('#card').style.display='none';if(P[id])fly(P[id].p,P[id].l);mark();if(innerWidth<760)$('#panel').classList.remove('open')}
VW.forEach(([id,n])=>{const b=document.createElement('button');b.textContent=n;b.dataset.v=id;b.onclick=()=>setView(id);$('#views').appendChild(b)});
Z.forEach((z,i)=>{const li=document.createElement('li');li.tabIndex=0;li.dataset.z='z'+i;
  li.innerHTML=`<div class="r"><span><i style="background:${z.c}"></i>${z.n}</span><b>${z.a.toLocaleString()}</b></div><div class="bar"><s style="width:${z.a/24.5}%;background:${z.c}"></s></div>`;
  const go=()=>{mode='orbit';ctl.enabled=true;active='z'+i;const [x0,x1,z0,z1]=z.r,k=Math.max(Math.min(Math.max(x1-x0,z1-z0),50),26);
    fly([z.cx+k*.7,k*.7+8,z.cz+k*1.1],[z.cx,3,z.cz]);mark();
    const note=z.k==='out'?'Outside the 7,000 sq.ft shed':z.k==='above'?'Mezzanine floor space above the ground zones':(z.a/70).toFixed(1)+'% of the 7,000 sq.ft shed';
    const c=$('#card');c.style.display='block';c.innerHTML=`<h3>${z.n}</h3><p>${z.d}</p><b style="color:var(--gold)">${z.a.toLocaleString()} sq.ft</b> &nbsp;${note}`;
    if(innerWidth<760)$('#panel').classList.remove('open')};
  li.onclick=go;li.onkeydown=e=>{if(e.key==='Enter')go()};$('#zones').appendChild(li)});
$('#menu').onclick=()=>$('#panel').classList.toggle('open');

/* toggles */
let night=false;
function setNight(n){night=n;const c=n?0x070b0d:0xb7c6cf;scene.background.set(c);scene.fog.color.set(c);scene.fog.density=n?.004:.0016;
  hemi.intensity=n?.22:.9;sun.intensity=n?.25:1.6;sun.color.set(n?0x8aa4ff:0xfff1d6);
  ceil.forEach(l=>l.intensity=n?1.6:.35);bulbMat.emissiveIntensity=n?2:.3;ren.toneMappingExposure=n?1.25:1;
  $('#bDay').textContent=n?'Day':'Night';$('#bDay').setAttribute('aria-pressed',n)}
function setSolid(b){shellMats.forEach(m=>{m.transparent=!b;m.opacity=b?1:.13;m.depthWrite=b;m.needsUpdate=true});$('#bSolid').setAttribute('aria-pressed',b)}
let solid=false;
$('#bDay').onclick=()=>setNight(!night);
$('#bSolid').onclick=()=>{solid=!solid;setSolid(solid)};
$('#bRoof').onclick=e=>{roofG.visible=!roofG.visible;e.target.setAttribute('aria-pressed',roofG.visible)};
$('#bRight').onclick=e=>{rightWall.visible=!rightWall.visible;e.target.setAttribute('aria-pressed',rightWall.visible)};
$('#bLab').onclick=e=>{const h=lr.domElement.classList.toggle('nolabels');e.target.setAttribute('aria-pressed',!h)};
$('#bRot').onclick=()=>{if(mode!=='orbit')setView('overview');setRot(!ctl.autoRotate)};
ctl.addEventListener('start',()=>{tw=null;setRot(false)});
ren.domElement.addEventListener('pointerdown',()=>{if(mode!=='orbit')setView('overview')});
setNight(false);setSolid(false);mark();

/* fly-through path above the central aisle, under the roof */
const curve=new THREE.CatmullRomCurve3(Array.from({length:12},(_,i)=>{const a=i/12*Math.PI*2;return V(Math.cos(a)*11,16+Math.sin(a*2)*1.5,Math.sin(a)*52)}),true);
const tmp=V(0,0,0),ease=k=>k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;
const clock=new THREE.Clock();
function loop(){
  requestAnimationFrame(loop);
  const dt=Math.min(clock.getDelta(),.05),t=clock.elapsedTime;
  workers.forEach(w=>{
    const a=t*w.sp+w.ph,s=Math.sin(a);
    if(w.amp){
      if(w.ax==='x')w.g.position.x=w.x+s*w.amp;else w.g.position.z=w.z+s*w.amp;
      w.dir=Math.cos(a)>=0?1:-1;w.g.rotation.y=w.ax==='x'?w.dir*Math.PI/2:(w.dir>0?0:Math.PI);
      const sw=Math.sin(t*5+w.ph)*.55;w.legs[0].rotation.x=sw;w.legs[1].rotation.x=-sw;w.arms[0].rotation.x=-sw;w.arms[1].rotation.x=sw;
    }else{w.g.rotation.y=Math.sin(t*.4+w.ph)*.6;w.head.position.y=1.37+Math.sin(t*1.5+w.ph)*.012}
    w.t.position.set(w.g.position.x,9,w.g.position.z)});
  spin.forEach((m,i)=>m.rotation.y+=dt*(1.5+i*.2));
  blink.forEach((m,i)=>m.material.emissiveIntensity=.4+.6*Math.abs(Math.sin(t*2+i)));
  items.forEach(b=>{b.position.z+=dt*4;if(b.position.z>44)b.position.z=25});
  steams.forEach(p=>{const a=p.geometry.attributes.position;for(let i=0;i<a.count;i++){let y=a.getY(i)+dt*1.6;if(y>23)y=14;a.setY(i,y)}a.needsUpdate=true});
  if(mode==='fly'){const u=(t*.045)%1;curve.getPointAt(u,cam.position);curve.getPointAt((u+.02)%1,tmp);tmp.y-=7;cam.lookAt(tmp)}
  else if(mode==='worker'){const w=workers[6];cam.position.set(w.g.position.x,6.2,w.g.position.z);cam.lookAt(w.g.position.x,5.2,w.g.position.z+w.dir*30)}
  else{
    if(tw){tw.t+=dt/tw.d;const k=ease(Math.min(tw.t,1));cam.position.lerpVectors(tw.p0,tw.p1,k);ctl.target.lerpVectors(tw.l0,tw.l1,k);if(tw.t>=1)tw=null}
    ctl.update()}
  ren.render(scene,cam);lr.render(scene,cam)}
loop();
addEventListener('resize',()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();ren.setSize(innerWidth,innerHeight);lr.setSize(innerWidth,innerHeight)});
</script>
